<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" role="img" aria-label="Швидкість запуску з плагінами, чистий запуск та економія пам'яті Paper проти Apis">
  <style>
    text {
      font-family: "Fira Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      fill: #ffffff;
      text-anchor: middle;
    }
    .mono {
      font-family: "Fira Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .base { stroke: rgba(255, 255, 255, 0.25); stroke-width: 1.5; }
    .bar-paper { fill: rgba(255, 255, 255, 0.28); }
    .bar-apis { fill: #ffffff; }
    .val { font-size: 12.5px; font-weight: 600; fill: #ffffff; }
    .val-muted { font-size: 12.5px; font-weight: 500; fill: rgba(255, 255, 255, 0.6); }
    .who { font-size: 11px; font-weight: 500; fill: rgba(255, 255, 255, 0.55); }
    .who-apis { font-size: 11px; font-weight: 600; fill: rgba(255, 255, 255, 0.9); }
    .grp { font-size: 13px; font-weight: 600; fill: rgba(255, 255, 255, 0.85); }
    .sub { font-size: 11.5px; fill: rgba(255, 255, 255, 0.6); }

    @media (prefers-color-scheme: light) {
      text { fill: #18181b; }
      .base { stroke: rgba(24, 24, 27, 0.25); }
      .bar-paper { fill: rgba(24, 24, 27, 0.25); }
      .bar-apis { fill: #18181b; }
      .val { fill: #18181b; }
      .val-muted, .sub { fill: rgba(24, 24, 27, 0.6); }
      .who { fill: rgba(24, 24, 27, 0.55); }
      .who-apis { fill: #18181b; }
      .grp { fill: #18181b; }
    }
  </style>

  <!-- Швидкість запуску (з плагінами): 12.27 с vs У 2.08× швидше (5.91 с) -->
  <text x="92" y="151" class="who">Paper</text>
  <rect x="75" y="159.6" width="34" height="118.4" rx="4" class="bar-paper" />
  <text x="188" y="22" class="who-apis">Apis</text>
  <rect x="171" y="32" width="34" height="246" rx="4" class="bar-apis" />
  <text x="92" y="300" class="val-muted mono">12.27 с</text>
  <text x="188" y="300" class="val">У 2.08× швидше</text>
  <text x="140" y="324" class="grp">Швидкість запуску</text>
  <text x="140" y="341" class="sub">(з плагінами)</text>

  <!-- Чистий запуск (без плагінів): ~6.0 с vs ~1.4 с (У 4.3× швидше) -->
  <text x="332" y="212" class="who">Paper</text>
  <rect x="315" y="220.6" width="34" height="57.4" rx="4" class="bar-paper" />
  <text x="428" y="22" class="who-apis">Apis</text>
  <rect x="411" y="32" width="34" height="246" rx="4" class="bar-apis" />
  <text x="332" y="300" class="val-muted mono">~6.0 с</text>
  <text x="428" y="300" class="val">У 4.3× швидше</text>
  <text x="380" y="324" class="grp">Чистий запуск</text>
  <text x="380" y="341" class="sub">(без плагінів)</text>

  <!-- Витрата пам'яті без гравців: 1887 MiB vs Економія -46% -->
  <text x="572" y="136" class="who">Paper</text>
  <rect x="555" y="144.8" width="34" height="133.2" rx="4" class="bar-paper" />
  <text x="668" y="22" class="who-apis">Apis</text>
  <rect x="651" y="32" width="34" height="246" rx="4" class="bar-apis" />
  <text x="572" y="300" class="val-muted mono">1887 MiB</text>
  <text x="668" y="300" class="val">Економія -46%</text>
  <text x="620" y="324" class="grp">Пам'ять без гравців</text>
  <text x="620" y="341" class="sub">(idle)</text>

  <!-- Baseline -->
  <line x1="28" y1="278" x2="732" y2="278" class="base" />
</svg>
