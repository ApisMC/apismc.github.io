<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" role="img" aria-label="Paper vs Apis performance comparison at 100 players">
  <style>
    text {
      font-family: "Fira Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      fill: #ffffff;
      text-anchor: middle;
    }
    .mono {
      font-family: "Fira Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .base { stroke: rgba(255, 255, 255, 0.25); stroke-width: 1.5; }
    .bar-paper { fill: rgba(255, 255, 255, 0.28); }
    .bar-apis { fill: #ffffff; }
    .val { font-size: 11.5px; font-weight: 600; fill: #ffffff; }
    .val-muted { font-size: 11.5px; font-weight: 500; fill: rgba(255, 255, 255, 0.6); }
    .who { font-size: 11px; font-weight: 500; fill: rgba(255, 255, 255, 0.55); }
    .who-apis { font-size: 11px; font-weight: 600; fill: rgba(255, 255, 255, 0.9); }
    .grp { font-size: 13px; font-weight: 600; fill: rgba(255, 255, 255, 0.85); }

    @media (prefers-color-scheme: light) {
      text { fill: #18181b; }
      .base { stroke: rgba(24, 24, 27, 0.25); }
      .bar-paper { fill: rgba(24, 24, 27, 0.25); }
      .bar-apis { fill: #18181b; }
      .val { fill: #18181b; }
      .val-muted { fill: rgba(24, 24, 27, 0.6); }
      .who { fill: rgba(24, 24, 27, 0.55); }
      .who-apis { fill: #18181b; }
      .grp { fill: #18181b; }
    }
  </style>

  <!-- Tick response: 27.5 ms vs 2.7x faster -->
  <text x="64" y="178" class="who">Paper</text>
  <rect x="49" y="186.9" width="30" height="91.1" rx="4" class="bar-paper" />
  <text x="142" y="22" class="who-apis">Apis</text>
  <rect x="127" y="32" width="30" height="246" rx="4" class="bar-apis" />
  <text x="64" y="300" class="val-muted mono">27.5 ms</text>
  <text x="142" y="300" class="val">2.7× faster</text>
  <text x="103" y="325" class="grp">Tick Latency</text>

  <!-- CPU load: 380% vs 2.04x lower -->
  <text x="259" y="149" class="who">Paper</text>
  <rect x="244" y="157.4" width="30" height="120.6" rx="4" class="bar-paper" />
  <text x="337" y="22" class="who-apis">Apis</text>
  <rect x="322" y="32" width="30" height="246" rx="4" class="bar-apis" />
  <text x="259" y="300" class="val-muted mono">380%</text>
  <text x="337" y="300" class="val">2.04× lower</text>
  <text x="298" y="325" class="grp">CPU Usage</text>

  <!-- Runtime heap: 757 MiB vs -39% -->
  <text x="454" y="119" class="who">Paper</text>
  <rect x="439" y="128.1" width="30" height="149.9" rx="4" class="bar-paper" />
  <text x="532" y="22" class="who-apis">Apis</text>
  <rect x="517" y="32" width="30" height="246" rx="4" class="bar-apis" />
  <text x="454" y="300" class="val-muted mono">757 MiB</text>
  <text x="532" y="300" class="val">Saved -39%</text>
  <text x="493" y="325" class="grp">Live Heap</text>

  <!-- GC pauses: 574 ms vs 4.1x shorter -->
  <text x="649" y="209" class="who">Paper</text>
  <rect x="634" y="217.8" width="30" height="60.2" rx="4" class="bar-paper" />
  <text x="727" y="22" class="who-apis">Apis</text>
  <rect x="712" y="32" width="30" height="246" rx="4" class="bar-apis" />
  <text x="649" y="300" class="val-muted mono">574 ms</text>
  <text x="727" y="300" class="val">4.1× shorter</text>
  <text x="688" y="325" class="grp">GC Pauses</text>

  <!-- Baseline -->
  <line x1="24" y1="278" x2="756" y2="278" class="base" />
</svg>
